<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit - SILIA Cosmetics</title>
  <meta property="og:title" content="Produits - SILIA Cosmetics">
  <meta property="og:description" content="Découvrez les caractéristiques et les avantages de nos produits de beauté haut de gamme.">
  <meta property="og:image" content="https://e-silia.github.io/SILIA/assets/img/share_image.jpg">
  <meta property="og:url" content="https://e-silia.github.io/SILIA/pack.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <style>
    /* Premium CSS Variables */
    :root {
      --bg-color: #fafafa;
      --text-color: #111;
      --offer-highlight: #ff4d4f;
      --success-green: #2e7d32;
      --glass-border: rgba(0,0,0,0.06);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    
    /* Header */
    .header {
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo img { height: 35px; mix-blend-mode: multiply; }
    .back-btn { text-decoration: none; color: #666; font-weight: 500; font-size: 0.95rem; transition: color 0.3s; }
    .back-btn:hover { color: #111; }

    /* Layout */
    .product-container {
      max-width: 1250px;
      margin: 60px auto;
      padding: 0 5%;
      display: flex;
      gap: 80px;
      align-items: flex-start;
    }

    /* Left Gallery */
    .product-gallery {
      flex: 1;
      position: sticky;
      top: 120px;
    }
    .main-image {
      width: 100%;
      background: linear-gradient(145deg, #ffffff, #f0f0f0);
      border-radius: 40px;
      padding: 0;
      box-sizing: border-box;
      box-shadow: 0 30px 60px rgba(0,0,0,0.05), inset 0 2px 0 rgba(255,255,255,1);
      border: 1px solid var(--glass-border);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      aspect-ratio: 1;
    }
    .main-image::after {
      content: ''; position: absolute; width: 300px; height: 300px; background: rgba(255,255,255,0.4);
      border-radius: 50%; filter: blur(40px); top: -50px; left: -50px;
    }

    /* Thumbnail Gallery */
    .thumbnail-gallery {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .thumb-item {
      width: 75px;
      height: 75px;
      border-radius: 15px;
      border: 2px solid transparent;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
      background: #fff;
      opacity: 0.6;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .thumb-item:hover, .thumb-item.active {
      opacity: 1;
      border-color: #111;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .main-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 2;
    }
    .main-image:hover img {
      transform: scale(1.05);
    }

    /* Right Info */
    .product-info {
      flex: 1;
      padding-bottom: 50px;
    }
    .badge {
      display: inline-block;
      background: #111;
      color: #fff;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 25px;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin: 0 0 20px 0;
      letter-spacing: -0.04em;
      line-height: 1.1;
      color: #111;
    }
    .rating {
      color: #f5a623;
      font-size: 1.2rem;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rating span { color: #888; font-size: 0.95rem; font-weight: 500; }

    /* Pricing */
    .pricing-block {
      background: #fff;
      border-radius: 30px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.04);
      border: 1px solid var(--glass-border);
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }
    .pricing-block::before {
      content: ''; position: absolute; left: 0; top: 0; width: 5px; height: 100%; background: var(--offer-highlight);
    }
    .price-row {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 12px;
    }
    .price-now {
      font-size: 3rem;
      font-weight: 800;
      color: #111;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .price-was {
      font-size: 1.4rem;
      text-decoration: line-through;
      color: #999;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .savings-badge {
      display: inline-block;
      background: rgba(76, 175, 80, 0.1);
      color: var(--success-green);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    /* Description */
    .description {
      font-size: 1.15rem;
      color: #555;
      line-height: 1.7;
      margin-bottom: 45px;
      font-weight: 400;
      white-space: pre-wrap;
    }

    /* What's Included */
    .included-section h3 {
      font-size: 1.4rem;
      margin: 0 0 20px 0;
      font-weight: 700;
      color: #111;
    }
    .included-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 50px;
    }
    .included-item {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.02);
    }
    .included-item:hover {
      transform: translateX(10px) translateY(-2px);
      border-color: #ddd;
      box-shadow: 0 15px 30px rgba(0,0,0,0.06);
    }
    .included-item img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      background: #f5f5f7;
    }
    .included-item div {
      flex: 1;
    }
    .included-item h4 { margin: 0 0 5px 0; font-size: 1.1rem; font-weight: 600; color: #111; }
    .included-item p { margin: 0; color: #777; font-size: 0.95rem; }
    .click-hint { font-size: 0.8rem; color: #bbb; background: #f5f5f5; padding: 4px 10px; border-radius: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
    .included-item:hover .click-hint { background: #111; color: #fff; }

    /* Actions */
    .action-buttons {
      display: flex;
      gap: 20px;
    }
    .btn {
      flex: 1;
      padding: 15px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      border: none;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .btn-add {
      background: #fff;
      color: #111;
      border: 2px solid #111;
    }
    .btn-add:hover {
      background: #111;
      color: #fff;
    }
    .btn-buy {
      background: var(--offer-highlight);
      color: #fff;
      box-shadow: 0 15px 30px rgba(255, 77, 79, 0.3);
    }
    .btn-buy:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(255, 77, 79, 0.4);
      background: #ff3333;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
      opacity: 0; visibility: hidden;
      transition: all 0.4s ease;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    
    .modal-content {
      background: #fff;
      width: 90%; max-width: 450px;
      border-radius: 35px;
      padding: 40px;
      position: relative;
      text-align: center;
      transform: translateY(40px) scale(0.95);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0) scale(1);
    }
    
    .modal-close {
      position: absolute; top: 20px; right: 25px;
      font-size: 2rem; cursor: pointer; color: #999;
      background: none; border: none; padding: 0; line-height: 1;
      transition: color 0.2s;
    }
    .modal-close:hover { color: #111; }
    
    .modal-img-wrap {
      width: 140px; height: 140px; margin: 0 auto 25px auto;
      background: #f9f9f9; border-radius: 25px;
      display: flex; justify-content: center; align-items: center;
      padding: 15px; border: 1px solid var(--glass-border);
    }
    .modal-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
    
    .modal-title { font-size: 1.8rem; font-weight: 700; margin: 0 0 10px 0; color: #111; }
    .modal-desc { font-size: 1.05rem; color: #666; margin: 0 0 25px 0; line-height: 1.5; }
    .modal-price-box {
      background: #f5f5f7; border-radius: 20px; padding: 15px; display: inline-block;
    }
    .modal-price-label { font-size: 0.85rem; color: #888; text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 5px; display: block; }
    .modal-price { font-size: 1.5rem; font-weight: 700; color: #999; text-decoration: line-through; }

    /* Mobile */
    @media (max-width: 900px) {
      .product-container { flex-direction: column; gap: 30px; margin: 20px auto; padding: 0 20px; }
      .product-gallery { position: static; width: 100%; }
      .main-image { border-radius: 25px; aspect-ratio: auto; min-height: 300px; padding: 20px; }
      .main-image::after { width: 200px; height: 200px; top: -30px; left: -30px; }
      
      .thumbnail-gallery { gap: 10px; margin-top: 15px; }
      .thumb-item { width: 60px; height: 60px; border-radius: 12px; }
      
      h1 { font-size: 2rem; margin-bottom: 10px; }
      .pricing-block { padding: 20px; margin-bottom: 30px; border-radius: 20px; }
      .price-now { font-size: 2.5rem; }
      .price-was { font-size: 1.2rem; }
      
      .included-item { padding: 15px; gap: 12px; border-radius: 15px; }
      .included-item img { width: 50px; height: 50px; border-radius: 10px; }
      .included-item h4 { font-size: 1rem; }
      .included-item p { font-size: 0.85rem; }
      
      /* Modern Sticky Mobile Action Buttons */
      .action-buttons { 
        position: fixed; 
        bottom: 0; left: 0; right: 0; 
        background: rgba(255, 255, 255, 0.95); 
        backdrop-filter: blur(10px); 
        -webkit-backdrop-filter: blur(10px);
        padding: 12px 15px 15px 15px; 
        box-shadow: 0 -5px 25px rgba(0,0,0,0.08); 
        z-index: 1000; 
        display: flex;
        flex-direction: row; 
        flex-wrap: nowrap;
        gap: 8px; 
        border-top: 1px solid #f0f0f0;
      }
      .product-info { padding-bottom: 90px; }
      .btn { 
        padding: 14px 5px; 
        font-size: 0.85rem; 
        flex: 1; 
        border-radius: 25px; 
        white-space: nowrap; 
        letter-spacing: -0.02em;
      }
      .btn-add { border-width: 1px; }
      
      .modal-content { padding: 30px 20px; width: 95%; max-width: 100%; }
      .modal-title { font-size: 1.4rem; }
      .modal-desc { font-size: 0.95rem; }
    }

    /* Shimmer Loading */
    #preloader {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-color); z-index: 999999;
      padding: 20px 5%; box-sizing: border-box;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    .shimmer-header {
      display: flex; justify-content: space-between; align-items: center; max-width: 1250px; margin: 0 auto 60px auto;
    }
    .shimmer-pack-container {
      display: flex; max-width: 1250px; margin: 0 auto; gap: 80px; align-items: flex-start;
    }
    .shimmer-pack-left { flex: 1.2; }
    .shimmer-pack-right { flex: 1; }
    
    .shimmer-block {
      background: #e8e8e8;
      background-image: linear-gradient(90deg, #e8e8e8 0px, #f4f4f4 150px, #e8e8e8 300px);
      background-size: 1000px 100%;
      animation: shimmerLine 2s infinite linear;
    }
    
    @keyframes shimmerLine {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    @media (max-width: 900px) {
      .shimmer-pack-container { flex-direction: column; gap: 40px; margin-top: 30px; }
      .shimmer-pack-left { width: 100%; }
      .shimmer-pack-right { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Shimmer Preloader -->
  <div id="preloader">
    <div class="shimmer-header">
      <div class="shimmer-block" style="width: 120px; height: 35px; border-radius: 10px;"></div>
      <div class="shimmer-block" style="width: 100px; height: 20px; border-radius: 5px;"></div>
    </div>
    
    <div class="shimmer-pack-container">
      <div class="shimmer-pack-left">
        <div class="shimmer-block" style="width: 100%; aspect-ratio: 1; border-radius: 40px;"></div>
      </div>
      <div class="shimmer-pack-right">
        <div class="shimmer-block" style="width: 150px; height: 30px; margin-bottom: 20px; border-radius: 20px;"></div>
        <div class="shimmer-block" style="width: 80%; height: 60px; margin-bottom: 30px; border-radius: 10px;"></div>
        <div class="shimmer-block" style="width: 100%; height: 120px; margin-bottom: 40px; border-radius: 30px;"></div>
        
        <div class="shimmer-block" style="width: 100%; height: 20px; margin-bottom: 15px; border-radius: 5px;"></div>
        <div class="shimmer-block" style="width: 90%; height: 20px; margin-bottom: 15px; border-radius: 5px;"></div>
        <div class="shimmer-block" style="width: 70%; height: 20px; margin-bottom: 40px; border-radius: 5px;"></div>
        
        <div class="shimmer-block" style="width: 100%; height: 90px; margin-bottom: 15px; border-radius: 20px;"></div>
        <div class="shimmer-block" style="width: 100%; height: 90px; margin-bottom: 15px; border-radius: 20px;"></div>
        
        <div style="display: flex; gap: 20px; margin-top: 40px;">
          <div class="shimmer-block" style="flex: 1; height: 60px; border-radius: 30px;"></div>
          <div class="shimmer-block" style="flex: 1; height: 60px; border-radius: 30px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="logo"><img src="assets/img/logo.png" alt="Silia Logo"></a>
    <a href="index.html" class="back-btn">← Retour à la boutique</a>
  </header>

  <!-- Product Container -->
  <div class="product-container">
    
    <!-- Left Gallery -->
    <div class="product-gallery">
      <div class="main-image">
        <img id="productImg" src="assets/img/serum.png" alt="Product">
      </div>
      <div class="thumbnail-gallery" id="thumbGallery">
        <!-- Thumbnails will be injected here -->
      </div>
    </div>

    <!-- Right Info -->
    <div class="product-info">
      <div class="badge" id="productBadge">Chargement...</div>
      <h1 id="productTitle">...</h1>

      <!-- Pricing Block -->
      <div class="pricing-block">
        <div class="price-row">
          <div class="price-now" id="productPriceNew">— MAD</div>
          <div class="price-was" id="productPriceOld" style="display:none"></div>
        </div>
        <div class="savings-badge" id="productSavings" style="display:none"></div>
      </div>

      <!-- Description -->
      <p class="description" id="productDesc">Chargement des détails du produit...</p>

      <!-- Included Items -->
      <!-- Included Items -->
      <div class="included-section" id="packItemsSection" style="display:none">
        <h3>Ce qui est inclus dans ce pack :</h3>
        <div class="included-list" id="packItemsList"></div>
      </div>

      <!-- Actions -->
      <div class="action-buttons">
        <button class="btn btn-add" id="addToCartBtn">Ajouter au panier</button>
        <button class="btn btn-buy" id="buyNowBtn">Acheter</button>
      </div>

    </div>
  </div>

  <!-- Modal for Product Details -->
  <div class="modal-overlay" id="productModal" onclick="closeModal(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal(event, true)">×</button>
      <div class="modal-img-wrap">
        <img src="" alt="Product Detail" id="modalImg">
      </div>
      <h3 class="modal-title" id="modalTitle">Product Title</h3>
      <p class="modal-desc" id="modalDesc">Product description goes here.</p>
      <div class="modal-price-box">
        <span class="modal-price-label">Prix Original</span>
        <span class="modal-price" id="modalPrice">0 MAD</span>
      </div>
    </div>
  </div>

  <script>
    // Hide Shimmer Loader
    window.addEventListener('load', () => {
      setTimeout(() => {
        const preloader = document.getElementById('preloader');
        if(preloader) { preloader.style.opacity = '0'; preloader.style.visibility = 'hidden'; }
      }, 800);
    });

    let currentProduct = null;

    async function loadProduct() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        document.getElementById('productTitle').textContent = 'Produit introuvable';
        document.getElementById('productDesc').textContent = 'Aucun identifiant de produit fourni. Revenez en arrière et sélectionnez un produit.';
        document.getElementById('productBadge').textContent = 'Erreur';
        return;
      }

      try {
        const { data, error } = await getClient().from('products').select('*').eq('id', id).single();
        if (error || !data) throw new Error('Produit introuvable');

        currentProduct = data;
        const newP = parseInt(data.price) || 0;
        const oldP = parseInt(data.old_price) || 0;
        const saved = oldP > newP ? oldP - newP : 0;

        // Update page title
        document.title = data.name + ' - SILIA';

        // Update image
        if (data.img) document.getElementById('productImg').src = data.img;

        // Update text
        document.getElementById('productBadge').textContent = data.name;
        document.getElementById('productTitle').textContent = data.name;
        
        let descHtml = (data.description || '')
          .replace(/~~(.*?)~~/g, '<span style="text-decoration:line-through; color:#999; font-weight:600;">$1</span>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        document.getElementById('productDesc').innerHTML = descHtml;

        // Update prices
        document.getElementById('productPriceNew').textContent = newP + ' MAD';
        if (oldP > 0) {
          const oldEl = document.getElementById('productPriceOld');
          oldEl.textContent = oldP + ' MAD';
          oldEl.style.display = 'block';
        }
        if (saved > 0) {
          const pct = Math.round(saved / oldP * 100);
          const savEl = document.getElementById('productSavings');
          savEl.textContent = `🔥 Vous économisez ${saved} MAD (-${pct}%)`;
          savEl.style.display = 'block';
        }

        // Update buttons
        document.getElementById('buyNowBtn').textContent = 'Acheter';

        // Render pack items if any
        const packItems = data.pack_items || [];
        if (packItems.length > 0) {
          const section = document.getElementById('packItemsSection');
          const list = document.getElementById('packItemsList');
          section.style.display = 'block';
          list.innerHTML = packItems.map(item => {
            const desc = item.desc || item.description || '';
            const words = desc.split(/\s+/).filter(w => w.length > 0);
            const shortDesc = words.length > 6 ? words.slice(0, 6).join(' ') + '...' : desc;
            const priceVal = item.oldPrice || item.old_price;
            const priceText = priceVal ? priceVal + ' MAD' : '';
            const img = item.img || 'assets/img/serum.png';
            
            // Encode single quotes for onclick attribute
            const safeTitle = (item.title || '').replace(/'/g, "\\'");
            const safeDesc = desc.replace(/'/g, "\\'");
            const safePrice = priceText.replace(/'/g, "\\'");

            return `
            <div class="included-item" onclick="openModal('${img}', '${safeTitle}', '${safeDesc}', '${safePrice}')">
              <img src="${img}" alt="${safeTitle}">
              <div>
                <h4>${item.title || ''}</h4>
                <p>${shortDesc}</p>
              </div>
              <div style="display:flex; flex-direction:column; align-items:flex-end;">
                ${priceVal ? `<span style="text-decoration:line-through; color:#999; font-size:0.85rem; margin-bottom:4px;">${priceVal} MAD</span>` : ''}
                <span class="click-hint">Details</span>
              </div>
            </div>
            `;
          }).join('');

          // Render Thumbnails under the main image
          const thumbGallery = document.getElementById('thumbGallery');
          const mainImgSrc = data.img || 'assets/img/serum.png';
          let thumbsHtml = `
            <div class="thumb-item active" onclick="swapImage('${mainImgSrc}', this)">
              <img src="${mainImgSrc}" alt="Main Product">
            </div>
          `;
          thumbsHtml += packItems.map(item => {
            const img = item.img || 'assets/img/serum.png';
            const safeTitle = (item.title || '').replace(/'/g, "\\'");
            return `
              <div class="thumb-item" onclick="swapImage('${img}', this)">
                <img src="${img}" alt="${safeTitle}">
              </div>
            `;
          }).join('');
          thumbGallery.innerHTML = thumbsHtml;
        }

      } catch(err) {
        document.getElementById('productTitle').textContent = 'Produit introuvable';
        document.getElementById('productDesc').textContent = err.message;
        document.getElementById('productBadge').textContent = 'Erreur';
      }
    }

    document.addEventListener('DOMContentLoaded', loadProduct);

    document.getElementById('addToCartBtn').addEventListener('click', function() {
      if (!currentProduct) return;
      let saved = [];
      try { saved = JSON.parse(localStorage.getItem('siliaCart') || '{"items":[]}').items; } catch(e) {}
      saved.push({ title: currentProduct.name, price: currentProduct.price + ' MAD', img: currentProduct.img, oldPrice: currentProduct.old_price || '' });
      localStorage.setItem('siliaCart', JSON.stringify({items: saved}));
      this.textContent = 'Ajouté ✓';
      this.style.background = '#2e7d32';
      this.style.color = '#fff';
      this.style.borderColor = '#2e7d32';
      setTimeout(() => {
        this.textContent = 'Ajouter au panier';
        this.style.background = '#fff';
        this.style.color = '#111';
        this.style.borderColor = '#111';
      }, 2000);
    });

    document.getElementById('buyNowBtn').addEventListener('click', function() {
      if (!currentProduct) return;
      localStorage.setItem('siliaCart', JSON.stringify({
        items: [{ title: currentProduct.name, price: currentProduct.price + ' MAD', img: currentProduct.img, oldPrice: currentProduct.old_price || '' }]
      }));
      window.location.href = 'checkout.html';
    });

    // Modal Logic
    const modal = document.getElementById('productModal');
    function openModal(imgSrc, title, desc, price) {
      document.getElementById('modalImg').src = imgSrc;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      document.getElementById('modalPrice').textContent = price;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeModal(e, force = false) {
      if (force || e.target === modal) {
        modal.classList.remove('active');
        document.body.style.overflow = 'auto';
      }
    }

    // Image Swap Logic
    function swapImage(imgSrc, element) {
      document.getElementById('productImg').src = imgSrc;
      document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
